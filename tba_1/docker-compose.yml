services:                 # list of programs (containers) to run
  db:                     # our one program, named "db"
    image: postgres:16    # use the official Postgres version 16
    environment:          # settings passed into Postgres on first start
      POSTGRES_USER: de          # database username
      POSTGRES_PASSWORD: de      # password (fine locally, never for real systems)
      POSTGRES_DB: water         # create a database called "water"
    ports:
      - "5433:5432"       # your laptop's port 5432 → the container's port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data   # save the data outside the container
volumes:
  pgdata:                 # declares that storage